extends:
  - "@commitlint/config-conventional"

rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - deps
      - docs
      - style
      - refactor
      - perf
      - test
      - build
      - ci
      - chore
      - revert

  scope-enum:
    - 2
    - always
    - - core
      - generator
      - di
      - systemone
      - openai
      - ratelimiting
      - caching
      - conformance
      - tests
      - benchmarks
      - samples
      - docs
      - ci
      - deps
      - roadmap
      - state
      - sync
      - milestone
      - main

  subject-case:
    - 2
    - never
    - - sentence-case
      - start-case
      - pascal-case
      - upper-case

  header-max-length:
    - 2
    - always
    - 100
