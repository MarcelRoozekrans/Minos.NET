name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

# Runs on the built-in GITHUB_TOKEN alone; no PAT or app key is stored. GitHub starts no workflow from an event that token
# creates, so the release PR it opens, and the tracking commit pushed to it, get no CI of their own. The last job makes up
# for that: workflow_dispatch is the one event the token may still trigger, so it dispatches ci.yml and the benchmark
# smoke run on the release branch, and their checks report on the branch's head commit like any PR's.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Moves unshipped analyzer rules and public API to shipped on the release PR branch, so the release commit carries
  # the move. Formerly shared from ZeroAlloc-Net/.github; the script now lives in tools/release.
  ship-release-tracking:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Move Unshipped entries to Shipped
        run: |
          set -euo pipefail
          version=$(jq -r '."." // empty' .release-please-manifest.json)
          if [ -z "$version" ]; then
            echo "::error::.release-please-manifest.json has no \".\" entry; only single-component manifests are supported"
            exit 1
          fi
          python3 tools/release/ship_release_tracking.py "$version"
          if git diff --quiet; then
            echo "Nothing unshipped for $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: mark analyzer rules and public api shipped in $version"
          git push

  # Runs the required checks on the release PR, after the tracking commit has landed so they test its final head.
  check-release-pr:
    needs: [release-please, ship-release-tracking]
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - name: Dispatch CI and the benchmark smoke run on the release branch
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run benchmarks.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f smoke-only=true

  # Starts the nuget.org publish for a release. GitHub starts no workflow from an event the built-in token creates, so
  # the release and its tag trigger nothing by themselves; workflow_dispatch is the one event the token may still start.
  # ci.yml's publish-nuget job refuses a 0.x version, so a 0.x release publishes nothing.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Dispatch the publish run on the release tag
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f publish_to_nuget=true
