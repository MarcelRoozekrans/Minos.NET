name: Release Please

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

# The release PR and the tracking commit pushed to it are written with a token from the release bot GitHub App, not
# the built-in GITHUB_TOKEN. GitHub starts no workflow from an event GITHUB_TOKEN creates, so with it the release PR got
# no CI of its own and a job here had to dispatch ci.yml and the benchmark smoke run onto the release branch. Pushes made
# with the App token raise ordinary pull_request events, so ci.yml and benchmarks.yml run on the release PR like on any
# other. The App key is a stored credential, but it never expires and acts as no person; it needs the
# RELEASE_BOT_CLIENT_ID variable and the RELEASE_BOT_PRIVATE_KEY secret.
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      # Pushes and PRs made with GITHUB_TOKEN trigger no workflows, so bot PRs
      # never got their required checks. A token from the release bot GitHub App
      # acts as the App, and its pushes trigger CI like anyone else's.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Moves unshipped analyzer rules and public API to shipped on the release PR branch, so the release commit carries
  # the move. Formerly shared from ZeroAlloc-Net/.github; the script now lives in tools/release.
  ship-release-tracking:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The App token, so this push triggers the release PR's checks on its final head.
      - name: Mint a release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Move Unshipped entries to Shipped
        run: |
          set -euo pipefail
          version=$(jq -r '."." // empty' .release-please-manifest.json)
          if [ -z "$version" ]; then
            echo "::error::.release-please-manifest.json has no \".\" entry; only single-component manifests are supported"
            exit 1
          fi
          python3 tools/release/ship_release_tracking.py "$version"
          if git diff --quiet; then
            echo "Nothing unshipped for $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: mark analyzer rules and public api shipped in $version"
          git push

  # Starts the nuget.org publish for a release. ci.yml has no tag or release trigger, so the publish run is started here,
  # on the tag, by dispatch.
  # ci.yml's publish-nuget job refuses a 0.x version, so a 0.x release publishes nothing.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Dispatch the publish run on the release tag
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f publish_to_nuget=true
