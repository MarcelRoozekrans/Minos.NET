name: Live smoke

# Calls the real TypeSafe and OpenRouter APIs, which bills a few small evaluations per run. The run also covers image
# state and Clef through OpenRouter; the Luna test runs only when the MINOS_LIVE_LUNA variable is 1. It records the
# conformance fixtures for both, seven probes each, and uploads them as the conformance-fixtures artifact; they reach the
# repository through a pull request, never from this workflow.
# It also records the provider-switch sample against TypeSafe and OpenRouter, eight requests each, and uploads the two
# files as the provider-switch-recordings artifact; they too reach the repository through a pull request.
# Manual only: never on pull requests or pushes, so forks can never reach the keys.
# Maintainers must also restrict the live-api environment's deployment branches to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-api
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Live tests
        env:
          MINOS_LIVE: '1'
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MINOS_LIVE_MODEL: ${{ vars.MINOS_LIVE_MODEL }}
          MINOS_LIVE_OPENROUTER_MODEL: ${{ vars.MINOS_LIVE_OPENROUTER_MODEL }}
          MINOS_LIVE_LUNA: ${{ vars.MINOS_LIVE_LUNA }}
          MINOS_CONFORMANCE_OUT: ${{ github.workspace }}/conformance-out
        run: dotnet test tests/Minos.NET.Live.Tests -c Release --logger "console;verbosity=detailed"

      - name: Upload the conformance fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-fixtures
          path: conformance-out
          if-no-files-found: warn

      - name: Record the provider-switch sample against TypeSafe and OpenRouter
        if: ${{ !cancelled() }}
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          dotnet run --project samples/Minos.NET.Samples.ProviderSwitch -c Release -- --provider typesafe --record
          dotnet run --project samples/Minos.NET.Samples.ProviderSwitch -c Release -- --provider openrouter --record

      - name: Upload the provider-switch recordings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: provider-switch-recordings
          path: samples/Minos.NET.Samples.ProviderSwitch/recordings/
          if-no-files-found: warn
