name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      aot-smoke-runs:
        description: How many times the aot-smoke job runs the published binary, stopping at the first failure
        type: number
        default: 1
      publish_to_nuget:
        description: Push the release packages to nuget.org. Only takes effect on a v* tag; see RELEASING.md
        type: boolean
        default: false
      resume:
        description: Finish a publish that died partway, skipping the packages already on nuget.org; see RELEASING.md
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Minos.NET.slnx

      - name: Build
        run: dotnet build Minos.NET.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Minos.NET.slnx --no-build -c Release --logger "trx" --results-directory ./test-results

      - name: Test the Banking77 sample build
        run: python3 -m unittest discover -s datasets/banking77 -p "test_build.py"

      - name: Run the cookbook samples in replay mode
        # Runs each sample's real entry point (argument parsing, config, host wiring) offline from its checked-in
        # recordings. ReplayHandler is what keeps replay offline: it is the primary handler and answers every request
        # from the recordings, and replay supplies a placeholder key that passes validation. The empty keys only guard
        # against a sample that runs live by mistake: it then fails at startup instead of calling the API. Every folder
        # with a recordings.json is a sample. A sample with several providers keeps one file per provider in
        # recordings/ and runs once per file, with --provider set to the file's name. nullglob makes a recordings/
        # folder with no files yet run nothing instead of failing.
        env:
          OPENROUTER_API_KEY: ""
          TYPESAFE_API_KEY: ""
        run: |
          shopt -s nullglob
          for recordings in samples/*/recordings.json; do
            dir=$(dirname "$recordings")
            name=$(basename "$dir")
            out="$RUNNER_TEMP/$name.txt"
            echo "::group::$name"
            status=0
            timeout 120s dotnet run --project "$dir" --no-build -c Release > "$out" || status=$?
            cat "$out"
            echo "::endgroup::"
            test "$status" -eq 0
            test -s "$out"
          done
          for recordings in samples/*/recordings/*.json; do
            dir=$(dirname "$(dirname "$recordings")")
            name=$(basename "$dir")
            provider=$(basename "$recordings" .json)
            out="$RUNNER_TEMP/$name-$provider.txt"
            echo "::group::$name, $provider"
            status=0
            timeout 120s dotnet run --project "$dir" --no-build -c Release -- --provider "$provider" > "$out" || status=$?
            cat "$out"
            echo "::endgroup::"
            test "$status" -eq 0
            test -s "$out"
          done

      - name: Check docs snippets
        # Every C# block in the user docs comes from tests/Minos.NET.Docs.Tests, which the Build step compiled.
        # Regenerate the docs and fail when any tracked file differs: a snippet changed without re-running
        # `dotnet mdsnippets`, or the tool rewrote a file it should not touch.
        run: |
          dotnet tool restore
          dotnet mdsnippets
          git diff --exit-code

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./test-results

      - name: Pack
        run: dotnet pack Minos.NET.slnx --no-build -c Release -o ./nupkg

  aot-smoke:
    runs-on: ubuntu-latest
    # Publishes samples/Minos.NET.AotSmoke with PublishAot=true and runs it: the client, the error mapper and
    # the generator-emitted question set must survive ILC with every warning treated as an error, including the full
    # IL2xxx/IL3xxx trim/AOT surface (closes #30). The run also enforces allocation budgets on the client's hot
    # paths through ZeroAlloc.TestHelpers' AllocationGate, so a regression there fails the job too.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore samples/Minos.NET.AotSmoke/Minos.NET.AotSmoke.csproj

      - name: Publish AOT
        run: dotnet publish samples/Minos.NET.AotSmoke/Minos.NET.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out

      - name: Run AOT binary
        # Runs once on pushes and pull requests. A manual dispatch can set aot-smoke-runs to repeat the run, for
        # example 20 times to check the allocation gates for flakes on Linux; it stops at the first failing run.
        env:
          RUNS: ${{ inputs.aot-smoke-runs || 1 }}
        run: |
          if ! [[ "$RUNS" =~ ^[0-9]+$ ]] || [ "$RUNS" -lt 1 ]; then
            echo "::error::aot-smoke-runs must be a whole number of at least 1, not '$RUNS'"
            exit 1
          fi
          for run in $(seq 1 "$RUNS"); do
            echo "::group::Run $run of $RUNS"
            status=0
            ./aot-out/Minos.NET.AotSmoke || status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::Run $run of $RUNS failed with exit code $status"
              exit "$status"
            fi
            echo "Run $run of $RUNS passed"
          done

  aot-surface:
    runs-on: ubuntu-latest
    # Publishes samples/Minos.NET.AotSurface with PublishAot=true and TrimMode=full. It roots the six packages,
    # Minos.NET, Minos.NET.SystemOne, Minos.NET.OpenAI, Minos.NET.DependencyInjection, Minos.NET.Caching and
    # Minos.NET.RateLimiting, whole through
    # TrimmerRootAssembly, so ILC analyses their members, not only the ones aot-smoke calls, plus the code the
    # generator emits for the host's question sets. Rooting reaches every non-generic member and every generic one ILC can share across reference
    # types; value-type generics, such as Choice<T> over an enum, are analysed through the host's instantiations of
    # every public generic type and method, which SurfaceGenericsTests keeps complete. Every IL2xxx/IL3xxx warning is
    # an error, so a trim or AOT hazard in the public API fails the job. The publish is the check; the binary is not
    # run.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore samples/Minos.NET.AotSurface/Minos.NET.AotSurface.csproj

      - name: Publish AOT with the six packages rooted
        run: dotnet publish samples/Minos.NET.AotSurface/Minos.NET.AotSurface.csproj -r linux-x64 -c Release -o ./aot-surface-out

  # Packs the six release packages exactly as publish-nuget does, inspects them, and rehearses the push against a local
  # folder feed, on every push and pull request, so the release path is exercised long before release day. A folder
  # feed silently drops .snupkg files, so symbol packages are checked by the inspection, not by the push. WorkflowWiringTests
  # pins the commands below; change them only together with it.
  pack-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Read the release version
        shell: bash
        run: |
          version=$(jq -r '."." // empty' .release-please-manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::.release-please-manifest.json gives '$version', not a version."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack the release build
        run: dotnet pack Minos.NET.slnx -c Release -p:MinosRelease=true -o artifacts/packages

      - name: Test the inspection script
        run: python3 -m unittest discover -s tools/release -p "test_inspect_packages.py"

      - name: Inspect the packages
        run: python3 tools/release/inspect_packages.py artifacts/packages "$PACKAGE_VERSION"

      - name: Rehearse the push against a local feed
        shell: bash
        run: |
          feed="$RUNNER_TEMP/local-feed"
          mkdir -p "$feed"
          dotnet nuget push "artifacts/packages/*.nupkg" --source "$feed" --skip-duplicate
          for package in artifacts/packages/*.nupkg; do
            if [ ! -f "$feed/$(basename "$package")" ]; then
              echo "::error::$(basename "$package") was pushed and did not arrive in the local feed."
              exit 1
            fi
          done
          before=$(find "$feed" -type f | wc -l)
          dotnet nuget push "artifacts/packages/*.nupkg" --source "$feed" --skip-duplicate
          after=$(find "$feed" -type f | wc -l)
          if [ "$before" -ne "$after" ]; then
            echo "::error::A second push changed the feed from $before to $after files; a re-run must change nothing."
            exit 1
          fi

      - name: Restore and build a consumer from the local feed
        shell: bash
        run: |
          app="$RUNNER_TEMP/consumer"
          dotnet new console -o "$app" --framework net10.0
          for package in Minos.NET Minos.NET.SystemOne Minos.NET.OpenAI Minos.NET.DependencyInjection Minos.NET.Caching Minos.NET.RateLimiting; do
            dotnet add "$app" package "$package" --version "$PACKAGE_VERSION" --no-restore
          done
          cat > "$app/nuget.config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$RUNNER_TEMP/local-feed" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local"><package pattern="Minos.NET*" /></packageSource>
              <packageSource key="nuget.org"><package pattern="*" /></packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          dotnet build "$app" -c Release

  # A release PR must have marked released analyzer rules and public API as shipped. release-please.yml dispatches this
  # workflow on the release branch, so the branch comes from github.ref_name when there is no pull request.
  release-tracking:
    if: ${{ startsWith(github.head_ref || github.ref_name, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check nothing is left unshipped
        run: python3 tools/release/ship_release_tracking.py --check

  # Publishes a release to nuget.org. release-please.yml dispatches this workflow on the release tag with
  # publish_to_nuget=true when it creates a release; a maintainer can dispatch it the same way to finish a push that
  # died partway, since --skip-duplicate makes a re-run safe. It runs after every other job on that exact commit, and it
  # refuses a 0.x version, a prerelease, and a tag that is not the manifest's version. The key comes from nuget.org's
  # Trusted Publishing; no key is stored. A .snupkg beside its .nupkg is delivered with the same push. The pack must
  # pass -p:MinosRelease=true: without it Directory.Build.props versions every build X.Y.Z-local, and the version is
  # compiled into the DLLs, so a pack after a build without the switch would ship release-numbered packages whose DLLs
  # and User-Agent still say -local. RELEASING.md has the procedure; WorkflowWiringTests pins the commands.
  publish-nuget:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget && startsWith(github.ref, 'refs/tags/v')
    needs: [build, aot-smoke, aot-surface, pack-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Refuse anything but a stable 1.0 or later release from its own tag
        shell: bash
        run: |
          version=$(jq -r '."." // empty' .release-please-manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Refusing to publish '$version': it is not a stable version."
            exit 1
          fi
          if [[ "$version" == 0.* ]]; then
            echo "::error::Refusing to publish $version: 0.x versions are not published to nuget.org."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Refusing to publish: the tag is $GITHUB_REF_NAME but the manifest says $version."
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Pack the release build
        run: dotnet pack Minos.NET.slnx -c Release -p:MinosRelease=true -o artifacts/packages

      - name: Inspect the packages
        run: python3 tools/release/inspect_packages.py artifacts/packages "$PACKAGE_VERSION"

      - name: Mint a short-lived nuget.org key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      # A release run pushes without --skip-duplicate, so a version that is already on nuget.org fails the run instead of
      # being skipped while the job goes green. Only a dispatch with resume=true, which finishes a push that died partway,
      # skips the packages that already arrived.
      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          RESUME: ${{ inputs.resume }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NuGet/login minted no key. Check the NUGET_USER repository variable and the Trusted Publishing policy on nuget.org; see RELEASING.md."
            exit 1
          fi
          skip_duplicate=""
          if [ "$RESUME" = "true" ]; then
            skip_duplicate="--skip-duplicate"
          fi
          if ! dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" $skip_duplicate; then
            echo "::error::nuget.org refused the push; its reason is on the error line above. A 409 can mean the version already exists or that the package ID is reserved by another owner; see RELEASING.md before re-running."
            exit 1
          fi

      - name: Attach the packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/packages/*.nupkg artifacts/packages/*.snupkg --clobber
