name: CI

on:
  push:
    branches: [ main, 'release-please--**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ZeroAlloc.Jev.slnx

      - name: Build
        run: dotnet build ZeroAlloc.Jev.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ZeroAlloc.Jev.slnx --no-build -c Release --logger "trx" --results-directory ./test-results

      - name: Run the cookbook samples in replay mode
        # Runs each sample's real entry point (argument parsing, config, host wiring) offline from its checked-in
        # recordings. ReplayHandler is what keeps replay offline: it is the primary handler and answers every request
        # from the recordings, and replay supplies a placeholder key that passes validation. The empty
        # OPENROUTER_API_KEY only guards against a sample that runs live by mistake: it then fails at startup instead
        # of calling the API. Every folder with a recordings.json is a sample.
        env:
          OPENROUTER_API_KEY: ""
        run: |
          for recordings in samples/*/recordings.json; do
            dir=$(dirname "$recordings")
            name=$(basename "$dir")
            out="$RUNNER_TEMP/$name.txt"
            echo "::group::$name"
            status=0
            timeout 120s dotnet run --project "$dir" --no-build -c Release > "$out" || status=$?
            cat "$out"
            echo "::endgroup::"
            test "$status" -eq 0
            test -s "$out"
          done

      - name: Check docs snippets
        # Every C# block in the user docs comes from tests/ZeroAlloc.Jev.Docs.Tests, which the Build step compiled.
        # Regenerate the docs and fail when any tracked file differs: a snippet changed without re-running
        # `dotnet mdsnippets`, or the tool rewrote a file it should not touch.
        run: |
          dotnet tool restore
          dotnet mdsnippets
          git diff --exit-code

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: ./test-results

      - name: Pack
        run: dotnet pack ZeroAlloc.Jev.slnx --no-build -c Release -o ./nupkg

  aot-smoke:
    runs-on: ubuntu-latest
    # Publishes samples/ZeroAlloc.Jev.AotSmoke with PublishAot=true and runs it: the client, the error mapper and
    # the generator-emitted question set must survive ILC with every warning treated as an error, including the full
    # IL2xxx/IL3xxx trim/AOT surface (closes #30). The run also enforces allocation budgets on the client's hot
    # paths through ZeroAlloc.TestHelpers' AllocationGate, so a regression there fails the job too.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Install AOT native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: dotnet restore samples/ZeroAlloc.Jev.AotSmoke/ZeroAlloc.Jev.AotSmoke.csproj

      - name: Publish AOT
        run: dotnet publish samples/ZeroAlloc.Jev.AotSmoke/ZeroAlloc.Jev.AotSmoke.csproj -r linux-x64 -c Release -o ./aot-out

      - name: Run AOT binary
        run: ./aot-out/ZeroAlloc.Jev.AotSmoke

  # Shared from ZeroAlloc-Net/.github: a release PR must mark released analyzer rules and public API as shipped.
  release-tracking:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
    uses: ZeroAlloc-Net/.github/.github/workflows/release-tracking.yml@main
