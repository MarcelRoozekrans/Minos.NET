name: Calibrate

# Every dispatch of this workflow is a billed run started by the maintainer: it sends 400 requests for the banking77
# set, 60 for the urgency set, or 460 for both, to the hosted provider chosen in the inputs. Dispatch only, never on a
# push, a pull request or a schedule, and it uses the live-api environment's keys.
# It installs the published Minos.NET.Tool and runs minos calibrate with docs/reports/minos.json, one request at a time.
# No prices are applied here: they are applied afterwards with minos report, so a price correction needs no new run.
# Each set is uploaded as calibration-<provider>-<set>, which holds the tool's output folder, results.partial.jsonl
# included. The artifacts reach docs/reports/<provider>/<set>/ through a pull request.
# The timeout covers the worst case, 460 items at the retries times the request timeout each. When the timeout or a
# cancel stops the job, the runner signals only the step's shell, so the Calibrate step runs minos in the background and
# its trap passes the stop on to minos as SIGTERM, waits for it, and starts no further set. A minos calibrate that
# receives SIGTERM saves results.partial.jsonl and its report, then exits 130, and the upload steps, which run with
# if: always(), keep them. Saving on a stop arrived in tool 1.4.0, which closed #230.
# Maintainers must also restrict the live-api environment's deployment branches to main.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Which hosted provider to calibrate
        type: choice
        required: true
        options:
          - typesafe
          - clef
      set:
        description: Which dataset to run
        type: choice
        default: both
        options:
          - both
          - urgency
          - banking77

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: live-api
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Install the released tool
        run: dotnet tool install Minos.NET.Tool --version 1.4.0 --tool-path "$RUNNER_TEMP/minos-tool"

      - name: Map the provider to its config section and report folder
        id: map
        env:
          PROVIDER: ${{ inputs.provider }}
        run: |
          case "$PROVIDER" in
            typesafe) echo "section=TypeSafe" >> "$GITHUB_OUTPUT"; echo "slug=typesafe" >> "$GITHUB_OUTPUT" ;;
            clef) echo "section=Clef" >> "$GITHUB_OUTPUT"; echo "slug=clef-flash" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unknown provider '$PROVIDER'"; exit 1 ;;
          esac

      # Both sets run even when the first stops, then the step fails if either did. The upload steps below still run.
      - name: Calibrate
        env:
          SET: ${{ inputs.set }}
          SECTION: ${{ steps.map.outputs.section }}
          SLUG: ${{ steps.map.outputs.slug }}
          TYPESAFE_API_KEY: ${{ inputs.provider == 'typesafe' && secrets.TYPESAFE_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ inputs.provider == 'clef' && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          case "$SET" in
            both|urgency|banking77) ;;
            *) echo "::error::Unknown set '$SET'"; exit 1 ;;
          esac
          status=0
          pid=
          # The runner signals only this shell (SIGINT, then SIGTERM after 7.5 s, a kill after 10 s). Pass it on as SIGTERM,
          # since a background job ignores SIGINT, let minos save results.partial.jsonl, and start no further set.
          trap 'trap "" INT TERM; if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null; wait "$pid"; fi; exit 130' INT TERM
          for set in urgency banking77; do
            if [ "$SET" != both ] && [ "$SET" != "$set" ]; then continue; fi
            case "$set" in
              urgency) dataset=datasets/banking77/banking77-urgency-v1.jsonl ;;
              banking77) dataset=datasets/banking77/banking77-minos-v1.jsonl ;;
            esac
            "$RUNNER_TEMP/minos-tool/minos" calibrate --dataset "$dataset" --config docs/reports/minos.json --provider "$SECTION" --parallel 1 --out "$RUNNER_TEMP/out/$SLUG-$set" & pid=$!
            wait "$pid" || status=1
            pid=
          done
          exit "$status"

      - name: Upload the urgency run
        if: always() && (inputs.set == 'both' || inputs.set == 'urgency')
        uses: actions/upload-artifact@v7
        with:
          name: calibration-${{ steps.map.outputs.slug }}-urgency
          path: ${{ runner.temp }}/out/${{ steps.map.outputs.slug }}-urgency
          if-no-files-found: warn

      - name: Upload the banking77 run
        if: always() && (inputs.set == 'both' || inputs.set == 'banking77')
        uses: actions/upload-artifact@v7
        with:
          name: calibration-${{ steps.map.outputs.slug }}-banking77
          path: ${{ runner.temp }}/out/${{ steps.map.outputs.slug }}-banking77
          if-no-files-found: warn
