name: Local systemone

# Serves a small decision model on the runner with ollajev, CPU only, and runs LocalSystemOneTests against it through
# the Custom preset with no key. It then records the provider-switch sample against it and uploads local.json as the
# provider-switch-local artifact, which reaches the repository through a pull request. No secrets: the server is local
# and nothing is billed. Not a required check.
# The commands, the model and its Apache-2.0 licence are from docs/plans/2026-10-11-phase-6.4-local-server-spike.md.
# The model is a GGUF file run by llama.cpp, so no code from its repository executes; never pass --trust.
on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/Minos.NET.Live.Tests/**'
      - 'samples/Minos.NET.Samples.Shared/**'
      - 'samples/Minos.NET.Samples.ProviderSwitch/**'
      - '.github/workflows/local-systemone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-systemone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Building the llama-cpp-python wheel is most of the 8 minute install; pip's cache keeps the built wheel.
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.12-ollajev-0.4.0

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-Mapika-decider-2b-GGUF-Q4_K_M

      - name: Install the server and pull the model
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu ollajev==0.4.0
          ollajev pull Mapika/decider-2b-GGUF:Q4_K_M

      - name: Start the server
        env:
          OLLAJEV_DEVICE: cpu
        run: |
          nohup ollajev serve Mapika/decider-2b-GGUF:Q4_K_M --port 8000 --no-browser > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/v1/models && exit 0; sleep 5; done
          echo "::error::The server did not answer GET /v1/models within 5 minutes"
          cat "$RUNNER_TEMP/serve.log"
          exit 1

      - name: Local systemone tests
        env:
          MINOS_LOCAL_SYSTEMONE_URL: http://127.0.0.1:8000/
          MINOS_LOCAL_SYSTEMONE_MODEL: Mapika/decider-2b-GGUF:Q4_K_M
        run: dotnet test tests/Minos.NET.Live.Tests -c Release --filter "FullyQualifiedName~LocalSystemOneTests" --logger "console;verbosity=detailed"

      - name: Record the provider-switch sample against the local server
        if: ${{ !cancelled() }}
        run: dotnet run --project samples/Minos.NET.Samples.ProviderSwitch -c Release -- --provider local --record

      - name: Upload the local recording
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: provider-switch-local
          path: samples/Minos.NET.Samples.ProviderSwitch/recordings/local.json
          if-no-files-found: warn

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/serve.log" || true
