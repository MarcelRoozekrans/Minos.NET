# The ZeroAlloc-Net/.website site picks this repository up once Phase 4.3 registers it
# as a submodule. Until then this workflow dispatches harmlessly to a site that does not
# yet include this repo's docs.
#
# Only user docs should trigger a dispatch: docs/planning, docs/superpowers and docs/plans
# change nearly every session, and each dispatch makes the org website repo open or update
# a submodule PR.
name: Trigger website rebuild

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/planning/**'
      - '!docs/superpowers/**'
      - '!docs/plans/**'

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to .website repo
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: ZeroAlloc-Net/.website
          event-type: submodule-update
