# ZeroAlloc-Net/.website includes this repository as its repos/jev submodule and serves docs/
# at jev.zeroalloc.net, with the logo and favicon from assets/. Each dispatch makes .website
# open or update its "update submodules" PR, which moves that submodule to this repository's
# latest main.
#
# Only user docs and assets should trigger a dispatch: docs/planning, docs/superpowers and docs/plans
# change nearly every session, and each dispatch makes the org website repo open or update
# a submodule PR.
name: Trigger website rebuild

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'assets/**'
      - '!docs/planning/**'
      - '!docs/superpowers/**'
      - '!docs/plans/**'

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to .website repo
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          repository: ZeroAlloc-Net/.website
          event-type: submodule-update
